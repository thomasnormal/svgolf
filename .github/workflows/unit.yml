# The tests that need no Lean and no Yosys (the whole suite is tests/run.py, on a machine with the
# toolchain: see README.md), and the rating build's pinned netlists on Linux and macOS.
# On a pull request that only adds records (and their writeups), those records are set aside first
# (leaderboard/pr_check.py --set-aside): the tests then run on the board the pull request goes to, because a
# record's derived tables (the ASAP7 view, the routed course, the other sizes, the schematics) are made by the
# maintainers when they make the record, never carried by the pull request; the `records` workflow checks the
# records themselves, and the site is then built once with them in place.
name: unit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2      # a pull request's merge commit and its first parent, the branch it goes to
      - name: Fetch lean-surfaces at the revision lake-manifest.json pins (the files the site reads)
        run: |
          rev=$(python3 -c 'import json; print(next(p["rev"] for p in json.load(open("lake-manifest.json"))["packages"] if p["name"].strip("\u00ab\u00bb") == "lean-models"))')
          dep=.lake/packages/lean-models
          git init -q "$dep"
          git -C "$dep" remote add origin https://github.com/thomasnormal/lean-surfaces
          git -C "$dep" sparse-checkout set --no-cone /LeanModels/ /docs/sv-refusals.json /extractors/sv/ /tools/gen_sv_refusals.py
          git -C "$dep" fetch -q --depth 1 --filter=blob:none origin "$rev"
          git -C "$dep" checkout -q FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: A pull request that only adds records sets them aside (the job summary says what was moved)
        if: github.event_name == 'pull_request'
        run: python3 leaderboard/pr_check.py --set-aside "$RUNNER_TEMP/added" --summary "$GITHUB_STEP_SUMMARY"
      - name: The layouts, the site generator, the leaderboard
        run: |
          python3 tests/checker/test_layout.py
          python3 -m unittest discover -s tests/site
          python3 tests/leaderboard/test_leaderboard.py
      - name: The exploration task (its board, its oracle, its reference files, the composed score, the check's own tests)
        run: |
          python3 leaderboard/exploreboard.py verify
          python3 tests/leaderboard/test_exploreboard.py
          python3 tasks/gemm/oracle.py
          python3 tasks/gemm/reference/gen.py --check
          python3 score/test_hier.py
          python3 tests/gemm/test_gemm.py
      - name: The site builds with the records the pull request adds put back
        if: github.event_name == 'pull_request'
        run: |
          if [ -d "$RUNNER_TEMP/added" ]; then cp -R "$RUNNER_TEMP/added/." .; fi
          python3 site/build.py --offline --out "$RUNNER_TEMP/site"
      - name: REFUSALS.md is what the pinned register renders
        run: |
          python3 .lake/packages/lean-models/tools/gen_sv_refusals.py --root .lake/packages/lean-models --emit-svgolf "$RUNNER_TEMP/REFUSALS.md"
          cmp "$RUNNER_TEMP/REFUSALS.md" REFUSALS.md
  # The rating build (score/yosys_wasm.py, README.md "The build ratings use") is one WebAssembly program for every
  # machine: installed from requirements.txt as a player installs it, it must give the pinned netlists of five designs
  # byte for byte here too (tests/checker/test_yosys_wasm.py), on Linux and on macOS
  rating-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The pinned packages (requirements.txt) and the module's own check
        run: |
          python3 -m pip install -r requirements.txt
          python3 score/yosys_wasm.py --self-check
      - name: The pinned sky130 liberty, checked by its hash
        run: python3 score/ppa.py --fetch-liberty
      - name: The same netlists, byte for byte, as on every other machine
        env:
          SVGOLF_REQUIRE_RATING_BUILD: "1"
        run: python3 tests/checker/test_yosys_wasm.py
